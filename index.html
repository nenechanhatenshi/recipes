<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイレシピ">
<link rel="apple-touch-icon" id="ati" href="apple-touch-icon.png">
<title>マイレシピ🍎</title>
<style>
:root{--bg:#f5f1ff;--card:#fff;--tx:#3f3560;--sub:#8b84ac;--ac:#9b7fe8;--ac2:#7cc8f2;--bd:#e0d9f7;--chip:#e6f4fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a2c;--card:#292540;--tx:#efeaff;--sub:#a9a2c8;--ac:#b59cff;--ac2:#6fb8e6;--bd:#3d3660;--chip:#2c3a58}}
:root[data-theme="dark"]{--bg:#1d1a2c;--card:#292540;--tx:#efeaff;--sub:#a9a2c8;--ac:#b59cff;--ac2:#6fb8e6;--bd:#3d3660;--chip:#2c3a58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(160deg,var(--bg),var(--chip)) fixed;color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:24px;margin:8px 0 12px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--chip);color:var(--tx);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(155,127,232,.15)}
.thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#e6dcff,#d6efff) center/cover;display:flex;align-items:center;justify-content:center;font-size:32px}
.cb{padding:10px}
.ct{font-weight:700;font-size:15px}
.cs{font-size:12px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:11px;background:var(--chip);color:var(--ac);border:1px solid var(--bd);border-radius:999px;padding:1px 9px;margin:6px 4px 0 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(155,127,232,.5);cursor:pointer}
.btn{border:0;border-radius:999px;padding:11px 20px;font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.btn.g{background:var(--chip);color:var(--ac)}.btn.d{background:transparent;color:#e0648a}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:22px}
.pre{white-space:pre-wrap}
ol.st{padding-left:22px}ol.st li{margin-bottom:8px}
ul.ig{list-style:none;padding:0}ul.ig li{padding:6px 0;border-bottom:1px dashed var(--bd)}
h3{font-size:15px;margin:22px 0 6px;color:var(--ac);border-left:4px solid var(--ac2);padding-left:8px}
.empty{text-align:center;color:var(--sub);padding:48px 0}
a{color:var(--ac);word-break:break-all}
.prev{max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;display:block}
.hide{display:none}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 -16px;padding:6px 16px 4px;transition:transform .25s ease}
.hdr.off{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 12px))}

.ov{position:fixed;inset:0;z-index:100;background:rgba(30,20,60,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.md{background:var(--card);color:var(--tx);border-radius:20px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
input[type=datetime-local]{min-height:44px}

.pk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--bd);cursor:pointer}
.pk input{width:22px;height:22px;padding:0;flex:none;accent-color:var(--ac)}

.sh{font-weight:700;color:var(--ac);margin:16px 0 6px}
.ig li.sh{border:0;padding:12px 0 2px}
.stp{display:flex;gap:10px;margin-bottom:8px}
.no{flex:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}

.chips.scr{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.chips.scr::-webkit-scrollbar{display:none}
.chips.scr .chip{flex:none;white-space:nowrap}

.mrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-bottom:1px solid var(--bd);margin-bottom:4px;font-size:14px;white-space:nowrap}
.sw{position:relative;width:46px;height:26px;flex:none;display:block;margin:0}
.sw input{position:absolute;opacity:0;width:0;height:0;padding:0;border:0}
.sl{position:absolute;inset:0;background:var(--bd);border-radius:999px;transition:.2s;cursor:pointer}
.sl:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.sl{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.sw input:checked+.sl:before{transform:translateX(20px)}

.hd{display:flex;justify-content:space-between;align-items:center}.hd .btn{padding:8px 16px;font-size:18px}
.menu{position:absolute;right:0;top:46px;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 8px 24px rgba(155,127,232,.3);padding:6px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font:inherit;padding:12px;border-radius:12px;cursor:pointer}.menu button:active{background:var(--chip)}
.tr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--bd)}.tr .btn{padding:6px 12px;font-size:13px}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" aria-label="追加">＋</button>
<script>
var TAGS=["お弁当","晩御飯","副菜"],KEY="recipes-v1",recipes=[],q="",ftag="";
function load(){try{recipes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){recipes=[]}
  try{var t=JSON.parse(localStorage.getItem("tags-v1")||"null");if(Array.isArray(t))TAGS=t}catch(e){}}
var idb=null;
function idbOpen(){return new Promise(function(res){try{var rq=indexedDB.open("recipebook",1);rq.onupgradeneeded=function(){rq.result.createObjectStore("kv")};rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){res(null)};rq.onblocked=function(){res(null)}}catch(e){res(null)}})}
function idbGet(k){return new Promise(function(res){try{var r=idb.transaction("kv").objectStore("kv").get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function idbSet(k,v){return new Promise(function(res){try{var t=idb.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=function(){res(true)};t.onerror=t.onabort=function(){res(false)}}catch(e){res(false)}})}
function save(){
  if(idb){idbSet("recipes",recipes).then(function(ok){if(!ok)alert("保存できませんでした。")});return true}
  try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch(e){alert("保存できませんでした（容量オーバーの可能性）。画像を小さくしてみてください。");return false}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var app=document.getElementById("app"),fab=document.getElementById("fab");
fab.onclick=function(){form()};

function renderRes(){
  var h='';
  var r=recipes.filter(function(x){
    if(ftag&&x.tags.indexOf(ftag)<0)return false;
    var s=(x.title+x.sub+x.ing+x.memo).toLowerCase();return !q||s.indexOf(q.toLowerCase())>=0});
  if(!r.length)h+='<div class="empty">'+(recipes.length?'該当なし':'まだレシピがありません<br>右下の＋から追加しましょう')+'</div>';
  else{h+='<div class="grid">';r.forEach(function(x){
    h+='<div class="card" data-id="'+x.id+'"><div class="thumb"'+(x.img?' style="background-image:url('+x.img+')"':'')+'>'+(x.img?'':'🍽️')+'</div><div class="cb"><div class="ct">'+esc(x.title)+'</div><div class="cs">'+esc(x.sub)+'</div>'+(x.time?'<div class="cs">⏱ '+esc(x.time)+'</div>':'')+x.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div></div>'});
    h+='</div>'}
  var res=document.getElementById("res");res.innerHTML=h;
  res.querySelectorAll(".card").forEach(function(c){c.onclick=function(){detail(c.dataset.id)}});
}

function list(){
  fab.classList.remove("hide");
  var h='<div id="hdr" class="hdr"><div class="hd"><h1>マイレシピ<span id="lg">🍎</span></h1><div style="position:relative"><button class="btn g" id="mn" aria-label="メニュー">☰</button><div class="menu hide" id="menu"><button id="imp">📋 貼り付けて追加</button><button id="tpl">🤖 AI用テンプレートをコピー</button><button id="ai">🧠 AI共有用にコピー</button><button id="exp">💾 データバックアップ</button><button id="rst">📥 バックアップから復元</button><button id="tgm">🏷 タグ管理</button><button id="set">⚙️ 設定</button><button id="hlp">👼🏻 ヘルプ</button><button id="upd">🔄 最新版に更新</button><div class="cs" style="padding:6px 12px 2px">'+VER+'</div></div></div></div><input id="q" placeholder="タイトル・材料で検索" value="'+esc(q)+'">';
  h+='<div class="chips scr"><button class="chip'+(ftag?'':' on')+'" data-f="">すべて</button>';
  TAGS.forEach(function(t){h+='<button class="chip'+(ftag===t?' on':'')+'" data-f="'+t+'">'+t+'</button>'});
  h+='</div>';
  h+='</div><div id="res"></div>';
  app.innerHTML=h;setLogo();renderRes();
  var mn=document.getElementById("menu");
  document.getElementById("mn").onclick=function(){mn.classList.toggle("hide")};
  document.getElementById("imp").onclick=paste;
  document.getElementById("exp").onclick=function(){mn.classList.add("hide");backupScreen()};
  document.getElementById("rst").onclick=function(){mn.classList.add("hide");pickBackup()};
  document.getElementById("upd").onclick=function(){mn.classList.add("hide");updateApp()};
  document.getElementById("hlp").onclick=function(){mn.classList.add("hide");helpScreen()};
  document.getElementById("set").onclick=function(){mn.classList.add("hide");settingsScreen()};
  document.getElementById("ai").onclick=function(){mn.classList.add("hide");copyForAI()};
  document.getElementById("tgm").onclick=tagMgr;
  document.getElementById("tpl").onclick=function(){mn.classList.add("hide");copyText(TPL,"テンプレートをコピーしました。AIに貼り付けて、続けてレシピを送ってください。")};
  app.onclick=function(e){if(!e.target.closest("#mn,#menu"))mn.classList.add("hide")};
  var qi=document.getElementById("q");
  qi.oninput=function(){q=qi.value;renderRes()};
  app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){ftag=b.dataset.f;list()}});
}

function detail(id){
  var x=recipes.find(function(r){return r.id===id});if(!x)return list();
  fab.classList.add("hide");window.scrollTo(0,0);
  var h='<div id="hdr" class="row hdr" style="margin:0 -16px 12px;padding:6px 16px;justify-content:space-between;align-items:center;flex-wrap:nowrap"><button class="btn g" id="back">← 戻る</button><div class="mrow" style="border:0;margin:0;padding:0;gap:10px"><span>☀️ 画面を暗くしない</span><label class="sw"><input type="checkbox" id="aw"><span class="sl"></span></label></div></div>';
  if(x.img)h+='<img class="hero" src="'+x.img+'" alt="">';
  h+='<h1 style="margin-bottom:0">'+esc(x.title)+'</h1><div class="cs">'+esc(x.sub)+'</div>'+(x.time?'<div class="cs">⏱ 調理時間：'+esc(x.time)+'</div>':'')+x.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('');
  var ing=x.ing.split("\n").filter(Boolean),st=x.steps.split("\n").filter(Boolean);
  if(ing.length)h+='<h3>材料</h3><ul class="ig">'+ing.map(function(i){return isHead(i)?'<li class="sh">'+esc(i.trim())+'</li>':'<li>'+esc(i)+'</li>'}).join('')+'</ul>';
  if(st.length)h+='<h3>作り方</h3><div>'+(function(){var n=0;return st.map(function(l){if(isHead(l))return '<div class="sh">'+esc(l.trim())+'</div>';n++;return '<div class="stp"><span class="no">'+n+'</span><span>'+esc(unnum(l))+'</span></div>'}).join('')})()+'</div>';
  if(x.url){var ok=/^https?:\/\//i.test(x.url);h+='<h3>参考URL</h3>'+(ok?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.url)+'</a>':esc(x.url))}
  if(x.memo)h+='<h3>メモ</h3><div class="pre">'+esc(x.memo)+'</div>';
  h+='<div class="row"><button class="btn" id="ed">編集</button><button class="btn d" id="del">削除</button></div>';
  h+='<div style="margin-top:28px;font-size:12px;color:#a3a3ad">作成日：'+fmt(x.created)+'　更新日：'+fmt(x.updated)+'</div>';
  app.innerHTML=h;
  document.getElementById("back").onclick=list;bindAwake();
  document.getElementById("ed").onclick=function(){form(x)};
  document.getElementById("del").onclick=function(){if(confirm("このレシピを削除しますか？")){recipes=recipes.filter(function(r){return r.id!==id});save();list()}};
}

function form(x){
  fab.classList.add("hide");window.scrollTo(0,0);
  x=x||{id:"",title:"",sub:"",time:"",tags:[],ing:"",steps:"",url:"",memo:"",img:""};
  if(!x.id){x.created=x.created||nowStr();x.updated=x.updated||nowStr()}
  var origUp=x.updated||"";
  var img=x.img,tags=x.tags.slice();
  var h='<h1>'+(x.id?'レシピを編集':'レシピを追加')+'</h1>'
  +'<label>画像</label><input type="file" id="f" accept="image/*"><img class="prev'+(img?'':' hide')+'" id="pv" src="'+(img||'')+'"><button class="btn g'+(img?'':' hide')+'" id="rm" style="margin-top:8px">画像を外す</button>'
  +'<label>タイトル *</label><input id="t" value="'+esc(x.title)+'">'
  +'<label>サブタイトル</label><input id="s" value="'+esc(x.sub)+'">'
  +'<label>調理時間</label><input id="tm" placeholder="例：20分" value="'+esc(x.time)+'">'
  +'<label>タグ</label><div class="chips" id="tg">'+TAGS.map(function(t){return '<button type="button" class="chip'+(tags.indexOf(t)>=0?' on':'')+'" data-t="'+t+'">'+t+'</button>'}).join('')+'</div>'
  +'<label>材料（1行に1つ）</label><textarea id="i">'+esc(x.ing)+'</textarea>'
  +'<label>作り方（1行に1手順）</label><textarea id="st">'+esc(x.steps)+'</textarea>'
  +'<label>参考URL</label><input id="u" type="url" placeholder="https://" value="'+esc(x.url)+'">'
  +'<label>メモ</label><textarea id="m">'+esc(x.memo)+'</textarea>'
  +'<label>作成日</label><input type="datetime-local" id="cr" max="'+nowStr()+'" value="'+esc(x.created||"")+'">'
  +'<label>更新日</label><input type="datetime-local" id="up" max="'+nowStr()+'" value="'+esc(x.updated||"")+'"><div class="cs" style="margin-top:4px">更新日をそのままにして保存すると、保存した日時に自動で更新されます。</div>'
  +'<div class="row"><button class="btn" id="ok">保存</button><button class="btn g" id="cx">キャンセル</button></div>';
  app.innerHTML=h;
  var pv=document.getElementById("pv"),rm=document.getElementById("rm");
  document.getElementById("f").onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
      var m=800,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      img=c.toDataURL("image/jpeg",0.75);pv.src=img;pv.classList.remove("hide");rm.classList.remove("hide")};im.src=rd.result};
    rd.readAsDataURL(file)};
  rm.onclick=function(){img="";pv.classList.add("hide");rm.classList.add("hide")};
  document.querySelectorAll("#tg .chip").forEach(function(b){b.onclick=function(){
    var t=b.dataset.t,i=tags.indexOf(t);if(i>=0)tags.splice(i,1);else tags.push(t);b.classList.toggle("on")}});
  document.getElementById("cx").onclick=function(){x.id?detail(x.id):list()};
  document.getElementById("ok").onclick=function(){
    var t=document.getElementById("t").value.trim();if(!t){alert("タイトルを入力してください");return}
    var cr=document.getElementById("cr").value,up=document.getElementById("up").value,nw=nowStr();
    if(cr>nw||up>nw){alert("作成日・更新日は、未来の日時にできません");return}
    if(cr&&up&&up<cr){alert("更新日が作成日より前になっています");return}
    if(up===origUp)up=nw;
    var d={id:x.id||String(Date.now()),title:t,sub:document.getElementById("s").value.trim(),time:document.getElementById("tm").value.trim(),tags:tags,
      ing:document.getElementById("i").value,steps:document.getElementById("st").value,
      url:document.getElementById("u").value.trim(),memo:document.getElementById("m").value,img:img,created:cr,updated:up};
    var old=recipes.slice();
    if(x.id)recipes=recipes.map(function(r){return r.id===x.id?d:r});else recipes.unshift(d);
    if(save())detail(d.id);else recipes=old};
}
function parseText(t){
  var x={id:"",title:"",sub:"",time:"",tags:[],ing:"",steps:"",url:"",memo:"",img:""};
  var map={"タイトル":"title","サブタイトル":"sub","調理時間":"time","時間":"time","タグ":"tg","材料":"ing","作り方":"steps","手順":"steps","参考URL":"url","URL":"url","メモ":"memo"};
  var re=/^[【\[■●]?\s*(サブタイトル|タイトル|調理時間|時間|タグ|材料|作り方|手順|参考URL|URL|メモ)(?:[】\]]\s*[:：]?|\s*[:：]|\s*$)\s*(.*)$/;
  var cur=null,b={},first=true;
  t.split(/\r?\n/).forEach(function(l){
    var s=l.trim();if(!s)return;
    var m=s.match(re);
    if(m){cur=map[m[1]];b[cur]=b[cur]||[];if(m[2])b[cur].push(m[2]);first=false;return}
    if(!cur){
      if(first){b.title=[s];first=false;return}
      if(/^https?:\/\//i.test(s)){b.url=[s];return}
      b.memo=b.memo||[];b.memo.push(s);return}
    b[cur].push(s)});
  function j(k,sep){return (b[k]||[]).join(sep)}
  x.title=j("title"," ");x.sub=j("sub"," ");x.time=j("time"," ");x.url=(b.url&&b.url[0])||"";
  x.tags=[];j("tg"," ").split(/[\s,、，・\/／]+/).forEach(function(t){if(!t||x.tags.indexOf(t)>=0)return;if(TAGS.indexOf(t)<0){TAGS.push(t);saveTags()}x.tags.push(t)});
  x.ing=(b.ing||[]).map(function(s){return s.replace(/^[・●\-]\s*/,"")}).join("\n");
  x.steps=(b.steps||[]).map(function(s){return s.replace(/^(?:\d+[.．)）、]|[①-⑳]|[・●\-])\s*/,"")}).join("\n");
  x.memo=j("memo","\n");
  return x}

function paste(){
  fab.classList.add("hide");window.scrollTo(0,0);
  app.innerHTML='<h1>貼り付けて追加</h1><div class="cs">レシピの文章を貼り付けてください。内容を確認してから保存できます。</div>'
  +'<label>ここに貼り付け</label><textarea id="pt" style="min-height:240px" placeholder="例&#10;タイトル：鶏の照り焼き&#10;調理時間：20分&#10;タグ：お弁当&#10;材料：&#10;鶏もも肉 1枚&#10;作り方：&#10;1. 焼く"></textarea>'
  +'<div class="row"><button class="btn" id="go">取り込む</button><button class="btn g" id="cx">戻る</button></div>';
  document.getElementById("cx").onclick=list;
  document.getElementById("go").onclick=function(){
    var v=document.getElementById("pt").value.trim();
    if(!v){alert("貼り付けてください");return}
    if(v[0]==="["||v[0]==="{"){var o=null;try{o=JSON.parse(v)}catch(e){}if(o){mergeImport(o);return}}
    form(parseText(v))}}

function exportData(rs){
  var part=!!rs;rs=rs||recipes;
  var d=new Date(),p=function(n){return ("0"+n).slice(-2)};
  var name="recipes-backup-"+(part?"part-":"")+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
  var json=JSON.stringify({app:"recipe-book",version:1,date:d.toISOString(),tags:TAGS,recipes:rs});
  var file=null;try{file=new File([json],name,{type:"application/json"})}catch(e){}
  function dl(){var u=URL.createObjectURL(new Blob([json],{type:"application/json"}));var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"マイレシピのバックアップ"}).catch(function(e){if(!e||e.name!=="AbortError")dl()});
    return}
  dl()}
function nowStr(){var n=new Date(),p=function(v){return ("0"+v).slice(-2)};return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate())+"T"+p(n.getHours())+":"+p(n.getMinutes())}
function fmt(s){return s?s.replace("T"," ").replace(/-/g,"/"):""}
var seq=0;
function normRec(r){
  var dt=function(v){return (typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v))?v.slice(0,16):""};
  return {id:r.id?String(r.id):"",title:String(r.title),sub:r.sub||"",time:r.time||"",created:dt(r.created),updated:dt(r.updated),
    tags:Array.isArray(r.tags)?r.tags.filter(function(t){if(typeof t!=="string")return false;if(TAGS.indexOf(t)<0)TAGS.push(t);return true}):[],
    ing:r.ing||"",steps:r.steps||"",url:r.url||"",memo:r.memo||"",img:r.img||""}}
function newId(){var id;do{seq++;id=String(Date.now()+seq)}while(recipes.some(function(e){return e.id===id}));return id}
function sameTitle(a,b){return a.title.trim()===b.title.trim()}
function replaceRec(ex,inc){var i=recipes.indexOf(ex);recipes[i]=Object.assign({},inc,{id:ex.id})}
function askConflict(ex,inc,remain){
  return new Promise(function(res){
    var ov=document.createElement("div");ov.className="ov";
    ov.innerHTML='<div class="md"><div style="font-size:17px;font-weight:700">⚠️ 更新日が違うレシピがあります</div><div style="margin:10px 0 6px;font-weight:700">'+esc(inc.title)+'</div><div class="cs">今のアプリ：更新日 '+(fmt(ex.updated)||"なし")+'</div><div class="cs">バックアップ：更新日 '+(fmt(inc.updated)||"なし")+'</div><div style="margin:14px 0 8px">どちらを残しますか？</div><div style="display:grid;gap:8px"><button class="btn g" id="k1">今のアプリのデータを残す</button><button class="btn" id="k2">バックアップのデータで上書き</button></div>'+(remain>0?'<label class="cs" style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="k3" style="width:20px;height:20px;padding:0;flex:none">残りの'+remain+'件も同じ選択にする</label>':'')+'</div>';
    document.body.appendChild(ov);
    function done(c){var k=ov.querySelector("#k3");var all=!!(k&&k.checked);ov.remove();res({c:c,all:all})}
    ov.querySelector("#k1").onclick=function(){done("keep")};
    ov.querySelector("#k2").onclick=function(){done("over")}})}
async function mergeImport(o){
  var a=Array.isArray(o)?o:(o&&o.recipes);
  if(!Array.isArray(a)){alert("このデータは読み込めませんでした");return}
  if(o&&Array.isArray(o.tags))o.tags.forEach(function(t){if(typeof t==="string"&&TAGS.indexOf(t)<0)TAGS.push(t)});
  var items=a.filter(function(x){return x&&x.title}).map(normRec);
  var st={add:0,over:0,keep:0,same:0},conf=[];
  items.forEach(function(inc){
    var ex=inc.id?recipes.find(function(e){return e.id===inc.id}):null;
    if(ex){
      if(!ex.updated&&!inc.updated){
        if(sameTitle(ex,inc)){replaceRec(ex,inc);st.over++}
        else{inc.id=newId();recipes.push(inc);st.add++}
      }else if(ex.updated===inc.updated){st.same++}
      else conf.push({ex:ex,inc:inc});
    }else{
      var t=!inc.updated?recipes.find(function(e){return !e.updated&&sameTitle(e,inc)}):null;
      if(t){replaceRec(t,inc);st.over++}
      else{if(!inc.id)inc.id=newId();recipes.push(inc);st.add++}
    }
  });
  var all=null;
  for(var i=0;i<conf.length;i++){
    var c=conf[i],ch=all;
    if(!ch){var rs=await askConflict(c.ex,c.inc,conf.length-i-1);ch=rs.c;if(rs.all)all=ch}
    if(ch==="over"){replaceRec(c.ex,c.inc);st.over++}else st.keep++;
  }
  recipes.sort(function(p,q2){return (Number(q2.id)||0)-(Number(p.id)||0)});
  saveTags();
  if(save()){alert("取り込みました\n追加 "+st.add+"件／上書き "+st.over+"件／今のを残した "+st.keep+"件／同じ内容 "+st.same+"件");list()}
}
function restoreFile(file){
  var rd=new FileReader();
  rd.onload=function(){var o=null;try{o=JSON.parse(rd.result)}catch(e){}if(!o){alert("このファイルは読み込めませんでした");return}mergeImport(o)};
  rd.readAsText(file)}

function getPref(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function setPref(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function isDark(){var t=getPref("theme-v1","auto");return t==="dark"||(t==="auto"&&!!window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function devil(){return getPref("icon-v1","apple")==="devil"}
function setLogo(){var l=document.getElementById("lg");if(!l)return;l.innerHTML='<img src="'+(devil()?DEVIL:NORMAL)+'" alt="" style="height:1.1em;vertical-align:-.18em;margin-left:4px">'}
function applyTheme(){
  var t=getPref("theme-v1","auto"),el=document.documentElement;
  if(t==="auto")el.removeAttribute("data-theme");else el.setAttribute("data-theme",t);
  setLogo()}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
(function(){var last=0,tm;
  window.addEventListener("scroll",function(){
    var h=document.getElementById("hdr");if(!h)return;
    var y=window.pageYOffset,d=y-last;last=y;
    if(y<=4){h.classList.remove("off");clearTimeout(tm);return}
    if(y>=document.documentElement.scrollHeight-window.innerHeight-2)return;
    if(d>3)h.classList.add("off");else if(d<-3)h.classList.remove("off");
    clearTimeout(tm);tm=setTimeout(function(){if(window.pageYOffset>4)h.classList.add("off")},800)},{passive:true})})();
function settingsScreen(){
  fab.classList.add("hide");window.scrollTo(0,0);
  var th=getPref("theme-v1","auto"),ic=getPref("icon-v1","apple")==="devil"?"devil":"apple";
  function chips(key,cur,opts){return '<div class="chips" data-k="'+key+'">'+opts.map(function(o){return '<button class="chip'+(cur===o[0]?' on':'')+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>'}
  app.innerHTML='<div class="row" style="margin:0 0 12px"><button class="btn g" id="back">← 戻る</button></div><h1>設定</h1>'
  +'<h3>画面の色</h3>'+chips("theme-v1",th,[["auto","端末に合わせる"],["light","ライト"],["dark","ダーク"]])
  +'<h3>タイトルのりんご</h3>'+chips("icon-v1",ic,[["apple","🍎 りんご"],["devil","👿 デビルりんご"]])
  +'<div class="cs">マイレシピのタイトルの横のマークが変わります。</div>';
  document.getElementById("back").onclick=list;
  app.querySelectorAll(".chips[data-k]").forEach(function(g){g.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){setPref(g.dataset.k,b.dataset.v);applyTheme();settingsScreen()}})})}
function pickBackup(){
  var i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=function(){if(i.files&&i.files[0])restoreFile(i.files[0])};i.click()}

function saveTags(){try{localStorage.setItem("tags-v1",JSON.stringify(TAGS))}catch(e){}}
function tagMgr(){
  fab.classList.add("hide");window.scrollTo(0,0);
  var h='<div class="row" style="margin:0 0 12px"><button class="btn g" id="back">← 戻る</button></div><h1>タグ管理</h1><div class="cs">タグの追加・名前の変更・削除ができます。</div>'
  +'<div style="display:flex;gap:8px;margin-top:14px"><input id="nt" placeholder="新しいタグ（例：朝ごはん）"><button class="btn" id="ad" style="white-space:nowrap">追加</button></div><div style="margin-top:10px">';
  TAGS.forEach(function(t,i){
    var n=recipes.filter(function(r){return r.tags.indexOf(t)>=0}).length;
    h+='<div class="tr"><span class="tag" style="font-size:14px;padding:4px 12px;margin:0">'+esc(t)+'</span><span class="cs">'+n+'件</span><span style="flex:1"></span><button class="btn g" data-r="'+i+'">名前変更</button><button class="btn d" data-d="'+i+'">削除</button></div>'});
  if(!TAGS.length)h+='<div class="empty">タグがありません</div>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById("back").onclick=list;
  document.getElementById("ad").onclick=function(){
    var v=document.getElementById("nt").value.trim();if(!v)return;
    if(TAGS.indexOf(v)>=0){alert("すでにあります");return}
    TAGS.push(v);saveTags();tagMgr()};
  app.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.r,o=TAGS[i],v=(prompt("新しい名前",o)||"").trim();
    if(!v||v===o)return;
    if(TAGS.indexOf(v)>=0){alert("すでにあります");return}
    TAGS[i]=v;recipes.forEach(function(r){r.tags=r.tags.map(function(t){return t===o?v:t})});
    if(ftag===o)ftag=v;saveTags();save();tagMgr()}});
  app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.d,o=TAGS[i];
    if(!confirm("「"+o+"」を削除しますか？\nレシピからも外れます（レシピ自体は消えません）"))return;
    TAGS.splice(i,1);recipes.forEach(function(r){r.tags=r.tags.filter(function(t){return t!==o})});
    if(ftag===o)ftag="";saveTags();save();tagMgr()}});
}

var awake=false,wl=null;
function acquire(cb){try{navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null});if(cb)cb(true)}).catch(function(){if(cb)cb(false)})}catch(e){if(cb)cb(false)}}
function storeAwake(){try{localStorage.setItem("awake-v1",awake?"1":"0")}catch(e){}}
try{awake=localStorage.getItem("awake-v1")==="1"}catch(e){}
if(awake&&"wakeLock" in navigator){acquire();document.addEventListener("click",function(){if(awake&&!wl)acquire()},{once:true})}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&awake&&!wl&&"wakeLock" in navigator)acquire()});

function bindAwake(){
  var aw=document.getElementById("aw");if(!aw)return;aw.checked=awake;
  aw.onchange=function(){
    if(aw.checked){
      if(!("wakeLock" in navigator)){alert("この端末・ブラウザでは使えません");aw.checked=false;return}
      acquire(function(ok){if(ok){awake=true;storeAwake()}else{aw.checked=false;alert("オンにできませんでした")}})
    }else{awake=false;if(wl){wl.release();wl=null}storeAwake()}}}

  function fb(){prompt("コピーしてください",t)}
  try{navigator.clipboard.writeText(t).then(function(){alert(msg)},fb)}catch(e){fb()}}
function isHead(l){return /^【.*】$/.test(l.trim())}
function unnum(l){return l.trim().replace(/^(?:\d+[.．)）、]|[①-⑳])\s*/,"")}
